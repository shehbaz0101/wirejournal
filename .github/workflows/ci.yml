name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.5.1
          staticcheck ./...
      - name: test
        run: go test -race -count=1 -timeout 15m ./...
      - name: bench smoke
        run: go test -count=1 -timeout 5m ./internal/bench
      - name: verify demo
        run: scripts/verify-demo.sh
